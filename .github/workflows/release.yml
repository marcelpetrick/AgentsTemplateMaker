name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify and build the tagged commit
        run: ./localPipeline.sh
        env:
          PLAYWRIGHT_INSTALL_SYSTEM_DEPS: "1"
      - name: Collect build, checksums, SBOM and changelog
        run: ./scripts/releaseAssets.sh "$GITHUB_REF_NAME"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "AgentsTemplateMaker ${GITHUB_REF_NAME#v}" \
            --notes-file release/CHANGELOG.md \
            --verify-tag
